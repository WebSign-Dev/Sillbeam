name: fharbor_${PROJECT}

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: fharbor_${PROJECT}_nginx
    depends_on:
      php:
        condition: service_started
      mariadb:
        condition: service_started
      phpmyadmin:
        condition: service_started
      mailpit:
        condition: service_started
      elasticsearch:
        condition: service_started
    env_file:
      - ${FABRYQ_HARBOR_RUNTIME_ENV}
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
      SERVER_NAME: ${PROJECT}.${DOMAIN_BASE}
      PHP_FPM_UPSTREAM: php:9000
    volumes:
      - ./.fabryq/harbor/config/nginx/default.http.template:/etc/nginx/templates/default.conf.template:ro
      - ./${APP_CODE_DIR:-backend}:/var/www/html:ro
    expose:
      - "80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app
      - gateway

  php:
    build:
      context: ./.fabryq/harbor/config/php
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
    container_name: fharbor_${PROJECT}_php
    environment:
      APP_ENV: dev
    volumes:
      - ./${APP_CODE_DIR:-backend}:/var/www/html
    networks:
      - app

  mariadb:
    image: mariadb:11.4
    container_name: fharbor_${PROJECT}_db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ${PROJECT}
      MARIADB_USER: ${PROJECT}
      MARIADB_PASSWORD: ${PROJECT}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app

  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    container_name: fharbor_${PROJECT}_pma
    environment:
      PMA_HOST: mariadb
      PMA_ABSOLUTE_URI: ${PROJECT_PUBLIC_URL}/pma/
    depends_on:
      mariadb:
        condition: service_started
    networks:
      - app

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: fharbor_${PROJECT}_mp
    environment:
      MP_DATA_FILE: /data/mailpit.db
      MP_WEBROOT: /mp
    volumes:
      - ${FABRYQ_HARBOR_DATA_DIR}/mailpit:/data
    expose:
      - "1025"
      - "8025"
    networks:
      - app

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    container_name: fharbor_${PROJECT}_es
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    networks:
      - app

networks:
  app:
    name: fharbor_${PROJECT}
  gateway:
    external: true
    name: fharbor_gateway

volumes:
  mariadb_data: {}
  es_data: {}
