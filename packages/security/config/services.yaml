services:
    _defaults:
        autowire: true
        autoconfigure: true

    Nexum\Security\Authentication\AccessTokenHasher: ~
    Nexum\Security\Authentication\NullAccessTokenStore: ~
    Nexum\Security\Authentication\AccessTokenStoreInterface: '@Nexum\Security\Authentication\NullAccessTokenStore'
    Nexum\Security\Authentication\NullSecondFactorGate: ~
    Nexum\Security\Authentication\SecondFactorGateInterface: '@Nexum\Security\Authentication\NullSecondFactorGate'

    Nexum\Security\Authentication\AccessTokenManager:
        arguments:
            $defaultTtl: '%nexum.security.access_token_ttl%'

    Nexum\Security\Authentication\AccessTokenHandler: ~
    Nexum\Security\Authentication\NexumUserChecker: ~

    Nexum\Security\Authorization\RolePermissionMap:
        arguments:
            $permissionsByRole: '%nexum.security.role_permissions%'

    Nexum\Security\Authorization\PermissionResolver: ~
    Nexum\Security\Authorization\PermissionVoter:
        tags: ['security.voter']

    Nexum\Security\Authorization\SecurityContext: ~
    Nexum\Security\Authorization\SecurityContextInterface: '@Nexum\Security\Authorization\SecurityContext'

    Nexum\Security\Http\ApiAuthenticationFailureHandler: ~
    Nexum\Security\Http\ApiAuthenticationEntryPoint: ~
    Nexum\Security\Http\ApiAccessDeniedHandler: ~
    Nexum\Security\Http\TokenAuthenticationSuccessHandler: ~

    Nexum\Security\Controller\TokenController:
        public: true
        tags: ['controller.service_arguments']

    Psr\Clock\ClockInterface:
        alias: Symfony\Component\Clock\NativeClock

    Symfony\Component\Clock\NativeClock: ~
