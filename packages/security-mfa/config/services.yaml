services:
    _defaults:
        autowire: true
        autoconfigure: true

    Nexum\Security\Mfa\Crypto\SecretCipher:
        arguments:
            $applicationSecret: '%kernel.secret%'

    Nexum\Security\Mfa\Authentication\MfaSecondFactorGate:
        arguments:
            $challengeTtl: '%nexum.security_mfa.challenge_ttl%'

    Nexum\Security\Authentication\SecondFactorGateInterface: '@Nexum\Security\Mfa\Authentication\MfaSecondFactorGate'

    Nexum\Security\Mfa\Authentication\MfaManager:
        arguments:
            $issuer: '%nexum.security_mfa.issuer%'
            $maxAttempts: '%nexum.security_mfa.max_attempts%'

    Nexum\Security\Mfa\Controller\MfaController:
        arguments:
            $limiter: '@limiter.nexum_security_mfa_verify'
        public: true
        tags: ['controller.service_arguments']
