services:
    Symfony\Component\Clock\NativeClock: ~
    Psr\Clock\ClockInterface: '@Symfony\Component\Clock\NativeClock'

    Nexum\Doctrine\EventListener\TimestampListener:
        arguments:
            $clock: '@Psr\Clock\ClockInterface'
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: onFlush }

    Nexum\Doctrine\Store\EntityStore:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $clock: '@Psr\Clock\ClockInterface'

    Nexum\Doctrine\Store\EntityStoreInterface:
        alias: Nexum\Doctrine\Store\EntityStore
        public: true
