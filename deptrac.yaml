deptrac:
    paths:
        - ./packages
    exclude_files:
        - '#.*\/tests\/.*#'
    layers:
        - name: Core
          collectors:
              - type: directory
                value: packages/core/src/.*
        - name: Kernel
          collectors:
              - type: directory
                value: packages/kernel/src/.*
        - name: Entity
          collectors:
              - type: directory
                value: packages/entity/src/.*
        - name: Doctrine
          collectors:
              - type: directory
                value: packages/doctrine/src/.*
        - name: Api
          collectors:
              - type: directory
                value: packages/api/src/.*
        - name: Security
          collectors:
              - type: directory
                value: packages/security/src/.*
        - name: User
          collectors:
              - type: directory
                value: packages/user/src/.*
        - name: SecurityMfa
          collectors:
              - type: directory
                value: packages/security-mfa/src/.*
        - name: SecurityPasskey
          collectors:
              - type: directory
                value: packages/security-passkey/src/.*
        - name: Exception
          collectors:
              - type: directory
                value: packages/exception/src/.*
        - name: Http
          collectors:
              - type: directory
                value: packages/http/src/.*
        - name: Serializer
          collectors:
              - type: directory
                value: packages/serializer/src/.*
        - name: Validator
          collectors:
              - type: directory
                value: packages/validator/src/.*
        - name: Logger
          collectors:
              - type: directory
                value: packages/logger/src/.*
        - name: Filesystem
          collectors:
              - type: directory
                value: packages/filesystem/src/.*
        - name: Messenger
          collectors:
              - type: directory
                value: packages/messenger/src/.*
        - name: Health
          collectors:
              - type: directory
                value: packages/health/src/.*
        - name: Client
          collectors:
              - type: directory
                value: packages/client/src/.*
        - name: Mailer
          collectors:
              - type: directory
                value: packages/mailer/src/.*
        - name: Management
          collectors:
              - type: directory
                value: packages/management/src/.*
        - name: QrCode
          collectors:
              - type: directory
                value: packages/qrcode/src/.*
        - name: Search
          collectors:
              - type: directory
                value: packages/search/src/.*
        - name: Notification
          collectors:
              - type: directory
                value: packages/notification/src/.*
        - name: Location
          collectors:
              - type: directory
                value: packages/location/src/.*
        - name: Payment
          collectors:
              - type: directory
                value: packages/payment/src/.*
        - name: Reporting
          collectors:
              - type: directory
                value: packages/reporting/src/.*
    ruleset:
        Core: []
        Kernel:
            - Core
        Entity:
            - Core
        Doctrine:
            - Core
            - Entity
            - Kernel
        Api:
            - Core
            - Kernel
            - Entity
            - Doctrine
        Security:
            - Core
            - Api
        User:
            - Core
            - Entity
            - Doctrine
            - Security
        SecurityMfa:
            - Api
            - Core
            - Entity
            - Security
            - User
        SecurityPasskey:
            - Api
            - Core
            - Entity
            - Security
            - User
        Exception:
            - Core
        Http:
            - Core
        Serializer: []
        Validator: []
        Logger: []
        Filesystem:
            - Core
        Messenger: []
        Health: []
        Client:
            - Http
        Mailer:
            - Core
        Management:
            - Api
            - Core
            - Kernel
            - Security
        QrCode:
            - Core
        Search: []
        Notification: []
        Location: []
        Payment: []
        Reporting: []
