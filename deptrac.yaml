deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*\/tests\/.*#'
    layers:
        - name: Core
          collectors:
              - type: directory
                value: src/Core/.*
        - name: Kernel
          collectors:
              - type: directory
                value: src/Kernel/.*
        - name: Architecture
          collectors:
              - type: directory
                value: src/Architecture/.*
        - name: Module
          collectors:
              - type: directory
                value: src/Module/.*
        - name: Project
          collectors:
              - type: directory
                value: src/Project/.*
        - name: Routing
          collectors:
              - type: directory
                value: src/Routing/.*
        - name: DependencyInjection
          collectors:
              - type: directory
                value: src/DependencyInjection/.*
        - name: Entity
          collectors:
              - type: directory
                value: src/Entity/.*
        - name: Doctrine
          collectors:
              - type: directory
                value: src/Doctrine/.*
        - name: Api
          collectors:
              - type: directory
                value: src/Api/.*
        - name: Security
          collectors:
              - type: directory
                value: src/Security/(?!Mfa/|Passkey/).*
        - name: User
          collectors:
              - type: directory
                value: src/User/.*
        - name: SecurityMfa
          collectors:
              - type: directory
                value: src/Security/Mfa/.*
        - name: SecurityPasskey
          collectors:
              - type: directory
                value: src/Security/Passkey/.*
        - name: Exception
          collectors:
              - type: directory
                value: src/Exception/.*
        - name: Http
          collectors:
              - type: directory
                value: src/Http/.*
        - name: Serializer
          collectors:
              - type: directory
                value: src/Serializer/.*
        - name: Validator
          collectors:
              - type: directory
                value: src/Validator/.*
        - name: Logger
          collectors:
              - type: directory
                value: src/Logger/.*
        - name: Filesystem
          collectors:
              - type: directory
                value: src/Filesystem/.*
        - name: Messenger
          collectors:
              - type: directory
                value: src/Messenger/.*
        - name: Health
          collectors:
              - type: directory
                value: src/Health/.*
        - name: Client
          collectors:
              - type: directory
                value: src/Client/.*
        - name: Mailer
          collectors:
              - type: directory
                value: src/Mailer/.*
        - name: Management
          collectors:
              - type: directory
                value: src/Management/.*
        - name: QrCode
          collectors:
              - type: directory
                value: src/QrCode/.*
        - name: Search
          collectors:
              - type: directory
                value: src/Search/.*
        - name: Notification
          collectors:
              - type: directory
                value: src/Notification/.*
        - name: Location
          collectors:
              - type: directory
                value: src/Location/.*
        - name: Payment
          collectors:
              - type: directory
                value: src/Payment/.*
        - name: Reporting
          collectors:
              - type: directory
                value: src/Reporting/.*
    ruleset:
        Core: []
        Kernel:
            - Core
            - Module
        Architecture:
            - Module
            - Project
        Module:
            - Architecture
            - Project
        Project:
            - Architecture
            - Module
        Routing:
            - Module
            - Project
        DependencyInjection:
            - Api
            - Architecture
            - Core
            - Doctrine
            - Entity
            - Filesystem
            - Http
            - Kernel
            - Mailer
            - Management
            - Messenger
            - Module
            - Project
            - QrCode
            - Routing
            - Security
            - SecurityMfa
            - SecurityPasskey
            - Serializer
            - User
            - Validator
        Entity:
            - Core
        Doctrine:
            - Core
            - Entity
        Api:
            - Core
            - Kernel
            - Entity
            - Doctrine
        Security:
            - Core
            - Api
        User:
            - Core
            - Entity
            - Doctrine
            - Security
        SecurityMfa:
            - Api
            - Core
            - Entity
            - Security
            - User
        SecurityPasskey:
            - Api
            - Core
            - Entity
            - Security
            - User
            - Project
        Exception:
            - Core
        Http:
            - Core
        Serializer: []
        Validator: []
        Logger: []
        Filesystem:
            - Core
        Messenger: []
        Health: []
        Client:
            - Http
        Mailer:
            - Core
        Management:
            - Api
            - Core
            - Module
            - Project
            - Security
        QrCode:
            - Core
        Search: []
        Notification: []
        Location: []
        Payment: []
        Reporting: []
