framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']
    trusted_hosts: ['%env(APP_TRUSTED_HOSTS)%']
    router:
        utf8: true
    handle_all_throwables: true
    serializer:
        enabled: true
    messenger:
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
        routing: { }
    php_errors:
        log: true

when@test:
    framework:
        test: true
        messenger:
            transports:
                async: 'in-memory://'
