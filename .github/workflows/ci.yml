name: CI
# No PR trigger: this workflow does not provide a required pre-merge CI check.
# Keep branch protection / ruleset requirements aligned separately.
on:
    push:
        branches: [main, dev]
    workflow_dispatch:

concurrency:
    # Development branches supersede older runs; main keeps each acceptance run.
    group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/dev') && 'latest' || github.run_id }}
    cancel-in-progress: ${{ (github.ref == 'refs/heads/dev') }}

jobs:
    compatibility:
        # Keep the QA environment stable across ubuntu-latest migrations.
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
                # Symfony 8.0 is unmaintained and blocked by Composer security advisories.
                symfony: ['7.4.*', '8.1.*']
        env:
            SILLBEAM_SYMFONY_VERSION: '${{ matrix.symfony }}'
            COMPOSER_PROCESS_TIMEOUT: '900'
        steps:
            - uses: actions/checkout@v6
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '${{ matrix.php }}'
                  extensions: pdo_sqlite, mbstring, xml, intl, zip, gd
                  ini-values: memory_limit=512M
                  tools: composer:v2
                  coverage: none
            - run: composer validate --strict
            - run: gpg --version
            # The allow-listed phpDocumentor shim plugin provisions its signed PHAR.
            - name: Resolve selected Symfony version
              run: |
                  php tools/prepare-compatibility.php
                  composer update --with-all-dependencies --no-scripts --no-interaction --prefer-dist
            - run: composer validate --strict
            - run: composer check-platform-reqs
            - run: composer audit --locked
            - run: composer audit --locked --working-dir=apps/test-app/app
            - run: composer test
            - run: composer analyse
            - run: composer architecture
            - run: composer cs:check
            - run: composer docs:build
            - run: composer test:flex-recipe
            - run: SILLBEAM_TEST_FRESH=1 composer test:flex-recipe
            - run: SILLBEAM_TEST_EXISTING_ROUTE=1 composer test:flex-recipe
            - run: SILLBEAM_TEST_DOCTRINE=1 composer test:flex-recipe
            - run: SILLBEAM_TEST_FRESH=1 SILLBEAM_TEST_DOCTRINE=1 composer test:flex-recipe
            - run: composer test:consumer
            - run: composer test:release-package
