name: CI
on: [push, pull_request]
jobs:
    compatibility:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
                symfony: ['7.4.*', '8.0.*', '8.1.*']
        env:
            SILLBEAM_SYMFONY_VERSION: '${{ matrix.symfony }}'
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '${{ matrix.php }}'
                  extensions: pdo_sqlite
                  ini-values: memory_limit=512M
                  tools: composer:v2
                  coverage: none
            - run: composer validate --strict
            - name: Resolve selected Symfony version
              run: |
                  php tools/prepare-compatibility.php
                  composer update --with-all-dependencies --no-scripts --no-plugins --no-interaction --prefer-dist
            - run: composer validate --strict
            - run: composer check-platform-reqs
            - run: composer test
            - run: composer analyse
            - run: composer architecture
            - run: composer cs:check
            - run: composer test:flex-recipe
            - run: SILLBEAM_TEST_DOCTRINE=1 composer test:flex-recipe
            - run: composer test:consumer
