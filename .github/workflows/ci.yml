name: CI
# No PR trigger: this workflow does not provide a required pre-merge CI check.
# Keep branch protection / ruleset requirements aligned separately.
on:
    push:
        branches: [main, dev]
    workflow_dispatch:

concurrency:
    # Share a group only on dev; unique groups elsewhere also preserve pending main runs.
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/dev' && 'latest' || github.run_id }}
    cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
    compatibility:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
                # Symfony 8.0 is unmaintained and blocked by Composer security advisories.
                symfony: ['7.4.*', '8.1.*']
        env:
            SILLBEAM_SYMFONY_VERSION: '${{ matrix.symfony }}'
            COMPOSER_PROCESS_TIMEOUT: '900'
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '${{ matrix.php }}'
                  extensions: pdo_sqlite
                  ini-values: memory_limit=512M
                  tools: composer:v2
                  coverage: none
            - run: composer validate --strict
            - name: Resolve selected Symfony version
              run: |
                  php tools/prepare-compatibility.php
                  composer update --with-all-dependencies --no-scripts --no-plugins --no-interaction --prefer-dist
            - run: composer validate --strict
            - run: composer check-platform-reqs
            - run: composer audit --locked
            - run: composer audit --locked --working-dir=apps/test-app/app
            - run: composer test
            - run: composer analyse
            - run: composer architecture
            - run: composer cs:check
            - run: composer test:flex-recipe
            - run: SILLBEAM_TEST_DOCTRINE=1 composer test:flex-recipe
            - run: composer test:consumer
            - run: composer test:release-package
